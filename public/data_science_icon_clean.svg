<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="iconBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>
  
  <!-- Rounded White Badge Background -->
  <rect width="160" height="160" rx="32" fill="#FFFFFF" />
  <rect x="1" y="1" width="158" height="158" rx="31" stroke="#E2E8F0" stroke-width="2" />
  
  <!-- Infinity Loop Symbol -->
  <g transform="translate(30, 28)">
    <path 
      d="M 50,42 
         C 30,22 10,28 10,42 
         C 10,56 30,62 50,42 
         C 70,22 90,28 90,42 
         C 90,56 70,62 50,42 Z" 
      stroke="url(#iconBlue)" 
      stroke-width="11" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      fill="none" 
    />
    <circle cx="10" cy="42" r="4.5" fill="#38BDF8" />
    <circle cx="90" cy="42" r="4.5" fill="#38BDF8" />
    <circle cx="50" cy="42" r="4" fill="#1D4ED8" />
  </g>

  <!-- Clear Typography -->
  <text x="80" y="120" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="14.5" fill="#0A1128" text-anchor="middle" letter-spacing="1">DATA SCIENCE</text>
  <text x="80" y="137" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="9.5" fill="#2563EB" text-anchor="middle" letter-spacing="3.5">COMMUNITY</text>
</svg>
